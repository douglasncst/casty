name: CLI Last.fm CI

on:
  pull_request:
    paths:
      - "cli/lastfm/**"
      - ".github/workflows/cli-lastfm-ci.yml"
  push:
    branches: [main]
    paths:
      - "cli/lastfm/**"
      - ".github/workflows/cli-lastfm-ci.yml"

permissions:
  contents: read

defaults:
  run:
    working-directory: cli/lastfm

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: cli/lastfm/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
