name: CLI Registry CI

on:
  pull_request:
    paths:
      - "cli/**"
      - ".github/workflows/cli-ci.yml"
  push:
    branches: [main]
    paths:
      - "cli/**"
      - ".github/workflows/cli-ci.yml"

permissions:
  contents: read

concurrency:
  group: cli-registry-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: cli

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: cli/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm pack --dry-run
